
services:
  postgres:
    image: postgres:16
    container_name: invoice-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoice_auditor}
      POSTGRES_USER: ${POSTGRES_USER:-auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6335:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c "</dev/tcp/127.0.0.1/6333"'
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  erp-seed:
    build:
      context: ./database
      dockerfile: dockerfile.seed
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auditor}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-invoice_auditor}
      ERP_MOCKDATA_DIR: /app/erp_mockdata
    volumes:
      - ./data/ERP_mockdata:/app/erp_mockdata:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mock-erp:
    build:
      context: ./mock_erp
      dockerfile: dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auditor}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-invoice_auditor}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      erp-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: dockerfile.agent
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auditor}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-invoice_auditor}
      MOCK_ERP_URL: http://mock-erp:8000
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QDRANT_URL: http://qdrant:6333
      INCOMING_DIR: /app/data/incoming
      REPORT_OUTPUT_DIR: /app/outputs/reports
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./data/incoming:/app/data/incoming
      - ./outputs/reports:/app/outputs/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
    restart: unless-stopped

  streamlit-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    environment:
      AGENT_API_URL: http://agent:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-auditor}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-invoice_auditor}
    ports:
      - "8502:8501"
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:

