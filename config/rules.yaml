validation:
  amounts:
    tolerance: 0.01

  required_fields:
    - invoice_number
    - vendor_name
    - invoice_date
    - currency
    - total_amount

  checks:
    - subtotal_matches_lines
    - tax_matches_rate
    - total_matches_subtotal_tax
    - currency_matches_erp
    - vendor_matches_erp
    - purchase_order_exists
    - purchase_order_vendor_matches
    - purchase_order_lines_match

business_rules:
  vendor:
    require_active: true
    fuzzy_match: true
    minimum_match_score: 0.80

  purchase_order:
    required: true
    require_open_status: false

  line_items:
    quantity_tolerance: 0.0001
    unit_price_tolerance: 0.01
    line_total_tolerance: 0.01

  tax:
    rate_tolerance: 0.0001
    amount_tolerance: 0.01

discrepancies:
  severity:
    missing_required_field: high
    vendor_mismatch: high
    purchase_order_not_found: high
    purchase_order_vendor_mismatch: high
    currency_mismatch: high
    quantity_mismatch: medium
    unit_price_mismatch: high
    line_total_mismatch: high
    subtotal_mismatch: high
    tax_mismatch: high
    total_mismatch: high
    extraction_error: high
    translation_error: medium

workflow:
  statuses:
    approved: APPROVED
    manual_review: MANUAL_REVIEW
    rejected: REJECTED

  human_review:
    enabled: true
    require_for:
      - missing_required_field
      - vendor_mismatch
      - purchase_order_not_found
      - purchase_order_vendor_mismatch
      - currency_mismatch
      - quantity_mismatch
      - unit_price_mismatch
      - line_total_mismatch
      - subtotal_mismatch
      - tax_mismatch
      - total_mismatch

rag:
  enabled: true
  top_k: 5
  relevance_threshold: 0.70
  max_retries: 3

  routing:
    structured_keywords:
      - invoice
      - vendor
      - purchase order
      - po
      - sku
      - discrepancy
      - validation
      - total
      - tax
      - currency

    semantic_keywords:
      - why
      - explain
      - policy
      - similar
      - history
      - recommendation
      - reason
      - trend

persistence:
  immutable_extraction: true
  store_raw_text: true
  store_translated_text: true
  store_reports: true
  store_human_feedback: true
  audit_events: true